<!DOCTYPE html>
<html>
<head>
    <title>Cafe Melo - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <h1>Cafe Melo</h1>
    <p class="intro-text">Welcome to Cafe Melo. We strive to make you happy with our delicious coffee and tea with our imported beans all the way from Brazil and milk sourced from Australia.</p>
    <br>

    <!-- Image Carousel -->
    <div class="carousel-container">
        <!-- The first image uses your existing local file -->
        <img id="carousel-img" src="images/7a29dfc903d98c6ba13b687ef1fa1d1a.jpg" alt="coffee picture">
        
        <div class="carousel-buttons">
            <button onclick="prevImage()">Previous</button>
            <button onclick="nextImage()">Next</button>
        </div>
    </div>

    <!-- JavaScript to run the carousel -->
    <script>
        // Add your local image paths to this array as you download new pictures.
        // I have included placeholder URLs for the other coffee and tea images for now.
        const images = [
            "images/7a29dfc903d98c6ba13b687ef1fa1d1a.jpg",
            "images/Gemini_Generated_Image_6teioh6teioh6tei.jpg",
            "images/Gemini_Generated_Image_6teioh6teioh6tei (1).jpg",
            "images/Gemini_Generated_Image_6teioh6teioh6tei (2).jpg"
        ];
        
        let currentIndex = 0;
        const imgElement = document.getElementById("carousel-img");

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            imgElement.src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            imgElement.src = images[currentIndex];
        }
    </script>

</body>
</html>
